name: Generate Dart code
description: >
  Regenerates the Dart code that is no longer committed (build_runner output
  and slang translations). A fresh checkout does not compile until this runs.


inputs:
  build-dir:
    description: >
      Directory the repository was checked out into, relative to the workspace
      root. build_apk*.yml copy the tree to $APK_BUILD_DIR before building and
      therefore need to override this.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Dependencies (app)
      shell: bash
      working-directory: ${{ inputs.build-dir }}/app
      run: flutter pub get

    # Order matters. The app's build_runner has to compile the whole dependency
    # graph, which includes packages/localsend_isolates; that package needs its
    # own generated mappers before it can be resolved.
    - name: Codegen (localsend_isolates)
      shell: bash
      working-directory: ${{ inputs.build-dir }}/packages/localsend_isolates
      run: dart run build_runner build --delete-conflicting-outputs

    # slang is a standalone CLI, not a build_runner builder: app/build.yaml sets
    # slang_build_runner enabled: false so that translations can be regenerated
    # without a full build_runner pass.
    - name: Codegen (app)
      shell: bash
      working-directory: ${{ inputs.build-dir }}/app
      run: |
        dart run slang
        dart run build_runner build --delete-conflicting-outputs
